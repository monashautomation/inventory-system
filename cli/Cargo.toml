[package]
name = "maims"
version = "0.1.0"
edition = "2021"
description = "Monash Automation Inventory System CLI (read-only)"
license = "MIT"

[[bin]]
name = "maims"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
thiserror = "1"
urlencoding = "2"

[dev-dependencies]
